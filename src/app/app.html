<div class="app-layout">

  @if(!esLogin) {
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-icon">🫧</span>
      <span class="brand-name">WashTrack</span>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/inicio" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">🏠</span> Inicio
      </a>
      <a routerLink="/ordenes/listar" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">📋</span> Órdenes
      </a>
      <a routerLink="/clientes/listar" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">👥</span> Clientes
      </a>
      <a routerLink="/entregas/listar" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">🚚</span> Entregas
      </a>
      <a routerLink="/facturas" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">🧾</span> Facturas
      </a>
      <a routerLink="/empleados" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">👔</span> Empleados
      </a>
      <a routerLink="/reportes" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">📊</span> Reportes
      </a>
    </nav>

    <div class="sidebar-footer">
      <a routerLink="/configuracion" class="nav-item">
        <span class="nav-icon">⚙️</span> Configuracion
      </a>
    </div>
  </aside>
  }

  <main [class.main-content]="!esLogin" [class.main-login]="esLogin">

    @if(!esLogin) {
    <header class="topbar">
      <h2 class="page-title">Sistema de Lavanderia - {{nombreTenant}}</h2>
      <div class="topbar-right">
        <div class="user-menu" (click)="toggleMenu()">
          <span class="user-badge">👤 {{ nombre }}</span>
          <span class="user-arrow">▾</span>
          @if(menuAbierto) {
          <div class="user-dropdown">
            <div class="dropdown-info">
              <span class="dropdown-nombre">{{ nombre }}</span>
              <span class="dropdown-rol">{{ rol }}</span>
            </div>
            <hr class="dropdown-divider">
            <button class="dropdown-item logout" (click)="cerrarSesion()">
              🚪 Cerrar Sesion
            </button>
          </div>
          }
        </div>
      </div>
    </header>
    }

    <div class="content-area">
      <router-outlet></router-outlet>
    </div>
  </main>

</div>
