<div class="app-layout">

  @if(!esLogin) {
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo">
        <img src="assets/washtrack_logo.png" alt="WashTrack">
        <!-- <span class="brand-name">WashTrack</span> -->
      </div>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/inicio" routerLinkActive="active" class="nav-item">
        <span class="nav-icon"><i class="fa-solid fa-house"></i></span> Inicio
      </a>
      <a routerLink="/ordenes/listar" routerLinkActive="active" class="nav-item">
        <span class="nav-icon"><i class="fa-solid fa-clipboard"></i></span> Órdenes
      </a>
      <a routerLink="/clientes/listar" routerLinkActive="active" class="nav-item">
        <span class="nav-icon"><i class="fa-solid fa-handshake"></i></span> Clientes
      </a>
      <a routerLink="/entregas/listar" routerLinkActive="active" class="nav-item">
        <span class="nav-icon"><i class="fa-solid fa-truck-fast"></i></span> Entregas
      </a>
      <a routerLink="/facturas" routerLinkActive="active" class="nav-item">
        <span class="nav-icon"><i class="fa-solid fa-file-invoice-dollar"></i></span> Facturas
      </a>
      <a routerLink="/empleados" routerLinkActive="active" class="nav-item">
        <span class="nav-icon"><i class="fa-solid fa-user-tie"></i></span> Empleados
      </a>
      <a routerLink="/reportes" routerLinkActive="active" class="nav-item">
        <span class="nav-icon"><i class="fa-solid fa-chart-line"></i></span> Reportes
      </a>
    </nav>

    <div class="sidebar-footer">
      <a routerLink="/configuracion" class="nav-item">
        <span class="nav-icon"><i class="fa-solid fa-gear"></i></span> Configuracion
      </a>
    </div>
  </aside>
  }

  <main [class.main-content]="!esLogin" [class.main-login]="esLogin">

    @if(!esLogin) {
    <header class="topbar">
      <h2 class="page-title">Sistema de Lavanderia - {{nombreTenant}}</h2>
      <div class="topbar-right">
        <div class="user-menu" (click)="toggleMenu()">
          <span class="user-badge"><i class="fa-solid fa-user"></i> {{ nombre }}</span>
          <span class="user-arrow">▾</span>
          @if(menuAbierto) {
          <div class="user-dropdown">
            <div class="dropdown-info">
              <span class="dropdown-nombre">{{ nombre }}</span>
              <span class="dropdown-rol">{{ rol }}</span>
            </div>
            <hr class="dropdown-divider">
            <button class="dropdown-item logout" (click)="cerrarSesion()">
              <i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesion
            </button>
          </div>
          }
        </div>
      </div>
    </header>
    }

    <div class="content-area">
      <router-outlet></router-outlet>
    </div>
  </main>

</div>
