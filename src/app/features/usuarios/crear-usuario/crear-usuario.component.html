<div class="page-wrapper">
    <div class="page-header">
        <h3 class="page-title">Nuevo Usuario</h3>
        <button class="btn-secondary" (click)="cancelar()">Cancelar</button>
    </div>

    <div class="form-card">
        @if(errorMsg) {
        <div class="alert-error">{{ errorMsg }}</div>
        }

        <div class="form-grid">
            <div class="form-group full-width">
                <label>Nombre completo</label>
                <input type="text" [(ngModel)]="usuarioRequest.nombre" placeholder="Ej. Juan Lopez Martinez" />
            </div>

            <div class="form-group">
                <label>Correo electronico</label>
                <input type="email" [(ngModel)]="usuarioRequest.email" placeholder="correo@empresa.com" />
            </div>

            <div class="form-group">
                <label>Contrasena</label>
                <input type="password" [(ngModel)]="usuarioRequest.password" placeholder="••••••••" />
            </div>

            <div class="form-group">
                <label>Rol</label>
                <select [(ngModel)]="usuarioRequest.rol">
                    @for(rol of roles; track rol) {
                    <option [value]="rol">{{ rol }}</option>
                    }
                </select>
            </div>
        </div>

        <div class="form-actions">
            <button class="btn-secondary" (click)="cancelar()"><i class="fa-solid fa-ban"></i> Cancelar</button>
            <button class="btn-primary" (click)="guardar()" [disabled]="guardando"><i
                    class="fa-solid fa-floppy-disk"></i>
                {{ guardando ? ' Guardando...' : ' Guardar Usuario' }}
            </button>
        </div>
    </div>
</div>
