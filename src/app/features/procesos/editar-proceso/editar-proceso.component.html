<div class="page-wrapper">
    <div class="page-header">
        <h3 class="page-title">Actualizar Proceso</h3>
    </div>

    <div class="form-card">
        @if(errorMsg) {
        <div class="alert-error">{{ errorMsg }}</div>
        }

        <div class="form-grid">
            <div class="form-group full-width">
                <label>Nombre del Proceso</label>
                <input type="text" [(ngModel)]="procesoRequest.nombre" placeholder="Ej. Lavado Stone" />
            </div>

            <div class="form-group full-width">
                <label>Descripcion</label>
                <textarea [(ngModel)]="procesoRequest.descripcion" rows="3"
                    placeholder="Descripcion del proceso..."></textarea>
            </div>

            <div class="form-group">
                <label>Precio Unitario (MXN)</label>
                <input type="number" [(ngModel)]="procesoRequest.preciounitario" min="1" step="0.01"
                    placeholder="0.00" />
            </div>
        </div>

        <div class="form-actions">
            <button class="btn-secondary" (click)="cancelar()"><i class="fa-solid fa-ban"></i> Cancelar</button>
            <button class="btn-primary" (click)="editar()" [disabled]="guardando"><i
                    class="fa-solid fa-floppy-disk"></i>
                {{ guardando ? ' Guardando...' : ' Guardar Proceso' }}
            </button>
        </div>
    </div>
</div>
