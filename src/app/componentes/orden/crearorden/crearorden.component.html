<div class="page-wrapper">
    <div class="page-header">
        <h3 class="page-title">Nueva Orden de Servicio</h3>
    </div>

    <div class="form-card">
        @if(errorMsg) {
        <div class="alert-error">{{ errorMsg }}</div>
        }

        <div class="form-grid">
            <div class="form-group">
                <label>Cliente</label>
                <div class="dropdown-search-wrapper">
                    <input type="text" class="dropdown-search-input" [(ngModel)]="textoBusquedaCliente"
                        (focus)="abrirDropdown()" (blur)="cerrarDropdown()" (input)="filtrarClientes()"
                        placeholder="Buscar cliente..." />

                    @if(mostrarDropdown) {
                    <div class="dropdown-list">
                        @for(cliente of listadoClientesFiltrado; track cliente.idCliente) {
                        <div class="dropdown-item" (mousedown)="seleccionarCliente(cliente)">
                            {{ cliente.nombre }}
                        </div>
                        } @empty {
                        <div class="dropdown-empty">No se encontraron clientes</div>
                        }
                    </div>
                    }
                </div>
            </div>

            <div class="form-group">
                <label>Estado</label>
                <select [(ngModel)]="orden.estado">
                    @for(estado of estados; track estado) {
                    <option [value]="estado">{{ estado }}</option>
                    }
                </select>
            </div>

            <div class="form-group">
                <label>Total Prendas</label>
                <input type="number" [(ngModel)]="orden.totalPrendas" min="1" />
            </div>

            <div class="form-group">
                <label>Fecha Ingreso</label>
                <input type="date" [(ngModel)]="orden.fechaIngreso" />
            </div>

            <div class="form-group">
                <label>Fecha Entrega</label>
                <input type="date" [(ngModel)]="orden.fechaEntrega" />
            </div>

            <div class="form-group full-width">
                <label>Observaciones</label>
                <textarea [(ngModel)]="orden.observaciones" rows="3" placeholder="Observaciones..."></textarea>
            </div>
        </div>

        <div class="form-actions">
            <button class="btn-secondary" (click)="cancelar()"><i class="fa-solid fa-ban"></i> Cancelar</button>
            <button class="btn-primary" (click)="guardar()" [disabled]="guardando"><i
                    class="fa-solid fa-floppy-disk"></i>
                {{ guardando ? ' Guardando...' : ' Guardar Orden' }}
            </button>
        </div>
    </div>
</div>
