<div class="page-wrapper">
    <div class="page-header">
        <h3 class="page-title">Editar Orden {{ orden.folio }}</h3>
    </div>

    <div class="form-card">
        @if(errorMsg) {
        <div class="alert-error">{{ errorMsg }}</div>
        }

        <div class="form-grid">
            <div class="form-group">
                <label>Folio</label>
                <input type="text" [value]="ordenCrearActualizar.folio" disabled />
            </div>

            <div class="form-group">
                <label>ID Cliente</label>
                <input type="text" [(ngModel)]="ordenCrearActualizar.clienteId" />
            </div>

            <div class="form-group">
                <label>Estado</label>
                <select [(ngModel)]="ordenCrearActualizar.estado">
                    @for(estado of estados; track estado) {
                    <option [value]="estado">{{ estado }}</option>
                    }
                </select>
            </div>

            <div class="form-group">
                <label>Total Prendas</label>
                <input type="number" [(ngModel)]="ordenCrearActualizar.totalPrendas" min="1" />
            </div>

            <div class="form-group">
                <label>Fecha Ingreso</label>
                <input type="date" [(ngModel)]="ordenCrearActualizar.fechaIngreso" />
            </div>

            <div class="form-group">
                <label>Fecha Entrega</label>
                @if (ordenCrearActualizar.fechaEntrega && ordenCrearActualizar.fechaEntrega !== 'null') {
                <input type="date" [(ngModel)]="ordenCrearActualizar.fechaEntrega" />
                } @else {
                <span class="detalle-valor-msg">⚠️ No especificado</span>
                <input type="date" [(ngModel)]="ordenCrearActualizar.fechaEntrega" />
                }
            </div>

            <div class="form-group full-width">
                <label>Observaciones</label>
                <textarea [(ngModel)]="ordenCrearActualizar.observaciones" rows="3"></textarea>
            </div>
        </div>

        <div class="form-actions">
            <button class="btn-secondary" (click)="cancelar()">Cancelar</button>
            <button class="btn-primary" (click)="guardar()" [disabled]="guardando">
                {{ guardando ? 'Actualizando...' : '💾 Actualizar Orden' }}
            </button>
        </div>
    </div>
</div>
