<div class="page-wrapper">
    <div class="page-header">
        <h3 class="page-title">Listado de Órdenes de Servicio</h3>
        <button class="btn-primary" (click)="nuevaOrden()">
            ➕ Nueva Orden
        </button>
    </div>

    <div class="card-table">
        <table class="tabla">
            <thead>
                <tr>
                    <th>Folio</th>
                    <th>Estado</th>
                    <th>Prendas</th>
                    <th>Fecha Ingreso</th>
                    <th>Fecha Entrega</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                @for(orden of listadoOrdenServicio; track orden.idOrden) {
                <tr>
                    <td>{{ orden.folio }}</td>
                    <td><span class="badge-estado">{{ orden.estado }}</span></td>
                    <td>{{ orden.totalPrendas }}</td>
                    <td>{{ orden.fechaIngreso }}</td>
                    <td>{{ orden.fechaEntrega }}</td>
                    <td>
                        <button class="btn-edit" (click)="editarOrden(orden)">✏️ Editar</button>
                        <button class="btn-delete" (click)="eliminarOrden(orden)">🗑️ Eliminar</button>
                    </td>
                </tr>
                } @empty {
                <tr>
                    <td colspan="6" class="empty-msg">No hay registros</td>
                </tr>
                }
            </tbody>
        </table>
    </div>
</div>
